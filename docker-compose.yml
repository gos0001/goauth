services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goauth_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    # Pulls the published image by default. `docker compose build app` still
    # builds from source and overrides it locally.
    image: ${IMAGE:-ghcr.io/gos0001/goauth}:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # Only the public port is published. 8081 stays reachable at
    # http://app:8081 for containers on this network and nowhere else.
    ports:
      - "8080:8080"
    env_file:
      - .env.development
    environment:
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/goauth_dev?sslmode=disable
      REDIS_URL: redis://redis:6379
      APP_ADDR: ":8080"
      # Inside a container 127.0.0.1 is the container's own loopback, so sibling
      # services could never reach the admin listener. Bind it to all interfaces
      # and keep it private by not publishing the port above.
      ADMIN_ADDR: "0.0.0.0:8081"
      # The schema is created on first start; no separate migrate step.
      AUTO_MIGRATE: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
